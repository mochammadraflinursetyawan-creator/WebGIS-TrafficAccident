name: Auto Twitter Crawler & Sync

on:
  schedule:
    # Berjalan otomatis setiap 1 jam
    - cron: '0 * * * *'
  # Bisa dijalankan secara manual kapan saja lewat tombol "Run workflow" di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Chrome Version
        run: |
          google-chrome --version || true

      - name: Install Dependencies
        run: |
          if [ -d "Traffic Accident/accident-webgis" ]; then
            cd "Traffic Accident/accident-webgis"
          fi
          pip install -r requirements.txt

      - name: Run Standalone Crawler
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN || 'c0e7b0fc30aa514c9d0ac118419010ba1e85b930' }}
          TARGET_TWITTER_ACCOUNT: "Merapi_Uncover"
        run: |
          if [ -d "Traffic Accident/accident-webgis" ]; then
            cd "Traffic Accident/accident-webgis"
          fi
          python backend/run_crawler_standalone.py

      - name: Commit & Push Updated Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update accidents data and media from Twitter" && git push)

